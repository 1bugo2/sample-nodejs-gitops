# Environment: prod - same single-node k3s lab, separate namespace.
#
# Honest about what this is: prod here shares a node with dev, so it demonstrates the
# promotion *mechanism* rather than genuine production isolation. A real prod would be a
# separate cluster, which is exactly why the ArgoCD Application addresses its destination
# by server URL rather than assuming in-cluster.
#
# What is real: the release pipeline writes the SAME digest here as to dev, but the prod
# Application has no automated sync policy - so this file records prod's intended state while
# the cluster stays on the previous version until a human syncs it. Prod therefore lags dev
# by an explicit human decision rather than by a separate build.

image:
  # Written by the release pipeline at the same time as dev's, and with the identical value.
  # Prod is a promotion of the artifact dev already ran, not a separate build - so approving
  # prod approves something already exercised.
  digest: "sha256:e1b1de8729a707b62ece34b210ed496436c1a6ef136a3e8f4fc66add72c9d2b4"
  tag: "v1.3.0"
imagePullSecrets:
  - name: ghcr-pull
ingress:
  className: traefik
  host: my-app-prod.192-168-56-101.nip.io
# Same allow-list as dev. /classified and /metrics stay unrouted - there is no argument for
# loosening that in prod.

# Floor of 2 rather than dev's, because prod should survive losing a pod without a cold
# start. Ceiling stays modest: this shares a 4-vCPU node with dev and the monitoring stack,
# and an aspirational maxReplicas the node cannot satisfy would just leave pods Pending.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      # Longer than dev's 300s. Shedding prod capacity on a brief lull is the expensive
      # mistake; waiting ten minutes to release two pods costs nothing.
      stabilizationWindowSeconds: 600
networkPolicy:
  enabled: true
metrics:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  dashboard:
    # Off in prod: the dashboard ConfigMap is keyed on a fixed Grafana uid, so installing it
    # from two releases makes them fight over the same dashboard. Dev owns it.
    enabled: false
